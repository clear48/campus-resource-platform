server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Spring Boot 请求总上限默认是 60 MB，入口层不能设置得更小。
    client_max_body_size 60m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # HTTP-01 验证只暴露 ACME 指定目录；未挂载或文件不存在时安全返回 404。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location /api/v1/ {
        # proxy_pass 不附加 URI 尾斜杠，确保完整的 /api/v1 路径传给后端。
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 入口统一覆盖可信转发头，并清空客户端可伪造的标准及历史代理头。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header Proxy-Client-IP "";
        proxy_set_header WL-Proxy-Client-IP "";
        proxy_set_header Connection "";

        # 文件上传和下载直接流式转发，降低小内存服务器上的临时缓冲压力。
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        # Vue History 模式的任意前端路由最终都回退到 SPA 入口。
        try_files $uri $uri/ /index.html;
    }
}
