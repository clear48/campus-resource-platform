# 公网 HTTP 只保留 Let's Encrypt HTTP-01 验证，其余请求统一跳转正式根域名。
server {
    listen 8080;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://campusshare.online$request_uri;
    }
}

# 容器健康检查不经过公网跳转，且只绑定 loopback，避免形成额外入口。
server {
    listen 127.0.0.1:8081;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

# TLS 握手需要证书，但未知 Host 在握手完成后立即拒绝，不提供站点或 API。
server {
    listen 8443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/tls/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:1m;
    ssl_session_timeout 10m;

    return 444;
}

# www 只承担兼容入口，路径和查询参数原样带到唯一正式根域名。
server {
    listen 8443 ssl;
    server_name www.campusshare.online;

    ssl_certificate /etc/nginx/tls/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:1m;
    ssl_session_timeout 10m;

    return 301 https://campusshare.online$request_uri;
}

server {
    listen 8443 ssl;
    server_name campusshare.online;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/tls/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:1m;
    ssl_session_timeout 10m;

    # 与后端 60 MB 请求总上限保持一致，避免入口层提前拒绝合法上传。
    client_max_body_size 60m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/v1/ {
        # 不附加 URI 尾斜杠，确保完整的 /api/v1 路径传给后端。
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 入口覆盖可信转发头并清空客户端可伪造的标准及历史代理头。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header Proxy-Client-IP "";
        proxy_set_header WL-Proxy-Client-IP "";
        proxy_set_header Connection "";

        # 上传和下载直接流式转发，避免在 2 GB 服务器上产生大文件缓冲。
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        # Vue History 模式的任意前端路由最终都回退到 SPA 入口。
        try_files $uri $uri/ /index.html;
    }
}
