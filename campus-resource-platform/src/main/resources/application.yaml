server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: campus-resource-platform

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/campus_resource_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    # 本地数据库密码请通过环境变量注入，避免把个人密码提交到远程仓库。
    password: ${MYSQL_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 本地 Redis 密码请通过环境变量注入；无密码实例保持为空即可。
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_FILE_SIZE:50MB}
      max-request-size: ${APP_UPLOAD_MAX_REQUEST_SIZE:60MB}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.john.campus.entity
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: ${JWT_SECRET:campus-resource-platform-dev-secret-change-me}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}
  upload:
    # 用户上传文件与源码、构建产物分离，默认落在专用运行时目录，仍可通过环境变量覆盖。
    storage-path: ${APP_UPLOAD_STORAGE_PATH:./data/user-uploads}

rank:
  sync:
    download-delta:
      # 默认启用生产同步；测试或维护窗口可显式关闭，避免后台任务在无 Redis 环境下触发连接。
      enabled: ${RANK_DOWNLOAD_DELTA_SYNC_ENABLED:true}
      # 固定延迟从上一次任务结束开始计算，避免本地调度线程重叠执行同一批同步。
      fixed-delay-ms: ${RANK_DOWNLOAD_DELTA_FIXED_DELAY_MS:60000}
      # 单次只持久化有限数量的资料，剩余增量保留在 syncing Hash，降低事务时长与锁持有时间。
      max-batch-size: ${RANK_DOWNLOAD_DELTA_MAX_BATCH_SIZE:500}
      # Redisson 看门狗会为未指定 leaseTime 的锁自动续期；客户端失活后停止续期并在此超时后释放锁。
      lock-watchdog-timeout-ms: ${RANK_DOWNLOAD_DELTA_LOCK_WATCHDOG_TIMEOUT_MS:30000}
    hot-ranking:
      # 总榜维护默认开启；测试或维护窗口可关闭，避免后台任务在无 Redis 环境下触发连接。
      enabled: ${RANK_HOT_RANKING_SYNC_ENABLED:true}
      # all 榜缺失时才重建，较长间隔用于 Redis 重启后的恢复，不反复覆盖实时行为增量。
      rebuild-fixed-delay-ms: ${RANK_HOT_RANKING_REBUILD_FIXED_DELAY_MS:300000}
      # 热度快照定期回写 MySQL，为搜索排序和 Redis 故障降级提供持久化兜底。
      snapshot-fixed-delay-ms: ${RANK_HOT_RANKING_SNAPSHOT_FIXED_DELAY_MS:300000}
      # 重建写 Redis 与快照写 MySQL 共用的单批上限，控制内存、网络往返和事务时长。
      batch-size: ${RANK_HOT_RANKING_BATCH_SIZE:500}
