server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: campus-resource-platform

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/campus_resource_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    # 本地数据库密码请通过环境变量注入，避免把个人密码提交到远程仓库。
    password: ${MYSQL_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 本地 Redis 密码请通过环境变量注入；无密码实例保持为空即可。
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_FILE_SIZE:50MB}
      max-request-size: ${APP_UPLOAD_MAX_REQUEST_SIZE:60MB}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.john.campus.entity
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: ${JWT_SECRET:campus-resource-platform-dev-secret-change-me}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}
  upload:
    storage-path: ${APP_UPLOAD_STORAGE_PATH:./data/uploads}

rank:
  sync:
    download-delta:
      # 固定延迟从上一次任务结束开始计算，避免本地调度线程重叠执行同一批同步。
      fixed-delay-ms: ${RANK_DOWNLOAD_DELTA_FIXED_DELAY_MS:60000}
      # 单次只持久化有限数量的资料，剩余增量保留在 syncing Hash，降低事务时长与锁持有时间。
      max-batch-size: ${RANK_DOWNLOAD_DELTA_MAX_BATCH_SIZE:500}
      # 锁 TTL 应覆盖单批数据库写入；异常实例未释放时依靠 TTL 自动恢复后续同步。
      lock-ttl-seconds: ${RANK_DOWNLOAD_DELTA_LOCK_TTL_SECONDS:300}
